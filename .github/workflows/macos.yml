name: macOS app

# Builds ss2ps.app on macOS (Apple Silicon and Intel), tests it, and attaches the zips to the release.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover tests -v

      - name: Build ss2ps.app
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --windowed --name ss2ps --osx-bundle-identifier io.github.frigolol.ss2ps \
            --clean --noconfirm ss2ps.py

      - name: Check the built app
        run: |
          APP=dist/ss2ps.app/Contents/MacOS/ss2ps
          "$APP" --version
          mkdir -p check
          "$APP" examples/superslicer_print.ini examples/superslicer_abs.ini examples/superslicer_printer.ini \
            -y -d check --no-overrides
          ls check
          test -f check/superslicer_printer.ini

      - name: Zip
        run: |
          cp overrides.example.ini dist/
          cd dist
          ditto -c -k --sequesterRsrc --keepParent ss2ps.app ../ss2ps-macos-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ss2ps-macos-${{ matrix.arch }}
          path: ss2ps-macos-${{ matrix.arch }}.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ss2ps-macos-${{ matrix.arch }}.zip --clobber
